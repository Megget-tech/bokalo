{% extends "base.html" %}
{% block head_title %}Testbetalning{% endblock %}
{% block content %}
<h1>Testbetalning</h1>
<p class="muted">Fejkad betaltjänst för utveckling. I drift skickas man till Stripe.</p>
<p><strong>{{ charge.description }}</strong><br>{{ charge.amount|floatformat:0 }} kr</p>
<form method="post" class="stack">{% csrf_token %}
  <button name="action" value="pay">Betala {{ charge.amount|floatformat:0 }} kr</button>
  <button name="action" value="cancel" class="secondary">Avbryt</button>
</form>
{% endblock %}
